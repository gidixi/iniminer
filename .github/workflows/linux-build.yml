name: Linux Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --locked --workspace --release

      - name: Upload cpuminer (linux x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: cpuminer-linux-x86_64
          path: target/release/cpuminer
          if-no-files-found: error

      - name: Upload gpuminer (linux x86_64)
        uses: actions/upload-artifact@v4
        with:
          name: gpuminer-linux-x86_64
          path: target/release/gpuminer
          if-no-files-found: error

      - name: Test
        run: cargo test --locked --workspace --all-targets

      - name: Publish binaries on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/cpuminer
            target/release/gpuminer
